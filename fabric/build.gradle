plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'me.modmuss50.mod-publish-plugin'
}

// The Minecraft version is part of the release name on purpose: CurseForge
// rejects a second file whose display name matches an existing one in the same
// project, and the same mod version is published for more than one Minecraft
// version.
def releaseName = "DayZ Inventory ${project.version} for ${project.minecraft_version}"

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // No `mappings` line: 26.x is unobfuscated. See common/build.gradle.

    // 26.2 dropped the `mod*` configurations along with the remap step - plain
    // `implementation` is the idiom now.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    implementation project(":common")
}

loom {
    runs {
        client {
            client()
            runDir "run"
        }
        server {
            server()
            runDir "run"
        }
    }
}

base {
    archivesName = "dayz-inventory-fabric-${project.minecraft_version}"
}

tasks.named('processResources', ProcessResources) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }

    from project(":common").sourceSets.main.resources

    // The refmap is generated by the common (Loom) project. Keep a stale copy
    // from shadowing the correctly named one if both ever exist.
    exclude 'common-refmap.json'
}

sourceSets {
    main {
        java {
            srcDir 'src/client/java'
        }
    }
}

tasks.named('jar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from project(":common").sourceSets.main.output
    exclude 'common-refmap.json'
}

publishMods {
    // 26.2 has no remap step, so the plain `jar` is the shippable artifact.
    file = jar.archiveFile
    changelog = rootProject.file("CHANGELOG.md").text
    type = STABLE

    modrinth {
        displayName = releaseName
        projectId = project.modrinth_id
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        // Taken from gradle.properties rather than hardcoded, so a branch bump
        // can never publish a jar under the wrong Minecraft version.
        minecraftVersions.add(project.minecraft_version)
        modLoaders.add("fabric")
        requires("fabric-api")
        optional("jei")
        optional("rei")
        optional("emi")
        optional("trinkets")
        optional("curios")
    }

    curseforge {
        displayName = releaseName
        projectId = "1596267"
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        // Taken from gradle.properties rather than hardcoded, so a branch bump
        // can never publish a jar under the wrong Minecraft version.
        minecraftVersions.add(project.minecraft_version)
        modLoaders.add("fabric")
        requires("fabric-api")
        optional("jei")
        optional("trinkets")
        optional("curios")
        client = true
        server = true
    }
}
