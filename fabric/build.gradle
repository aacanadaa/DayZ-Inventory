plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'me.modmuss50.mod-publish-plugin'
}

def releaseName = "DayZ Inventory ${project.version}"

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    implementation project(":common")
}

loom {
    runs {
        client {
            client()
            runDir "run"
        }
        server {
            server()
            runDir "run"
        }
    }
}

base {
    archivesName = "dayz-inventory-fabric"
}

tasks.named('processResources', ProcessResources) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }

    from project(":common").sourceSets.main.resources

    // The refmap is generated by the common (Loom) project. Keep a stale copy
    // from shadowing the correctly named one if both ever exist.
    exclude 'common-refmap.json'
}

sourceSets {
    main {
        java {
            srcDir 'src/client/java'
        }
    }
}

tasks.named('jar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from project(":common").sourceSets.main.output
    exclude 'common-refmap.json'
}

publishMods {
    file = remapJar.archiveFile
    changelog = rootProject.file("CHANGELOG.md").text
    type = STABLE

    modrinth {
        displayName = releaseName
        projectId = project.modrinth_id
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        minecraftVersions.add("1.20.1")
        modLoaders.add("fabric")
        requires("fabric-api")
        optional("jei")
        optional("rei")
        optional("emi")
        optional("trinkets")
        optional("curios")
    }

    curseforge {
        displayName = releaseName
        projectId = "1596267"
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        minecraftVersions.add("1.20.1")
        modLoaders.add("fabric")
        requires("fabric-api")
        optional("jei")
        optional("trinkets")
        optional("curios")
        client = true
        server = true
    }
}
