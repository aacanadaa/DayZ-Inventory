plugins {
    id 'net.minecraftforge.gradle' version '6.0.+'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'me.modmuss50.mod-publish-plugin'
}

def releaseName = "DayZ Inventory ${project.version}"

minecraft {
    mappings channel: 'official', version: project.minecraft_version
    
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            
            mods {
                dayz_inventory {
                    // Only this project's output is on the mod path. The common
                    // module's java and resources directories are compiled and
                    // processed into sourceSets.main above, so adding it again
                    // would put a second copy of the mixin configs and Loom's
                    // intermediary refmap on the classpath and break Mixin.
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                dayz_inventory {
                    // Only this project's output is on the mod path. The common
                    // module's java and resources directories are compiled and
                    // processed into sourceSets.main above, so adding it again
                    // would put a second copy of the mixin configs and Loom's
                    // intermediary refmap on the classpath and break Mixin.
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // NOTE: deliberately no `implementation project(':common')` here.
    // sourceSets.main below compiles the common module's sources directly, so a
    // project dependency would only put a second copy of those classes - and
    // Loom's intermediary refmap - on the classpath, which breaks Mixin.
}

sourceSets {
    main {
        java {
            srcDirs += project(':common').sourceSets.main.java.srcDirs
        }
        resources {
            srcDirs += project(':common').sourceSets.main.resources.srcDirs
        }
    }
}

mixin {
    add sourceSets.main, "dayz-inventory.refmap.json"
    config "dayz-inventory.mixins.json"
    config "dayz-inventory.client.mixins.json"
}

// The common module's classes and resources are compiled and processed into this
// project's own output via sourceSets.main above, so the jar needs no extra
// `from` for them. Anything pulled in from common's build directory would only
// add duplicate classes plus Loom's intermediary refmap, which Forge cannot use.
jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes([
            'Specification-Title'     : 'dayz_inventory',
            'Specification-Vendor'    : 'suoim',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : 'suoim',
            'MixinConfigs'            : 'dayz-inventory.mixins.json,dayz-inventory.client.mixins.json'
        ])
    }
}

// MixinGradle writes the generated Searge refmap to build/tmp and only injects it
// into the packaged jar. Dev runs (`runClient` / `runServer`) load this mod from
// the compiled resources and classes directories instead, and the `common`
// project - which is built by Loom - contributes a refmap with the *same name*
// that targets intermediary. Forge cannot resolve intermediary targets, so Mixin
// would rewrite every target to class_XXXX names and fail with
// "specifies a target class which is not supported".
//
// Copy the Searge refmap into our own resources so this project's output, which
// Forge places first on the mod classpath, shadows the intermediary one during
// development exactly as it does in the packaged jar.
def forgeRefmap = layout.buildDirectory.file('tmp/compileJava/dayz-inventory.refmap.json')

tasks.named('processResources', ProcessResources) {
    dependsOn tasks.named('compileJava')

    // Bring in the Searge refmap so dev runs resolve it (see note below).
    from(forgeRefmap)

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

base {
    archivesName = "dayz-inventory-forge"
}

publishMods {
    file = jar.archiveFile
    changelog = rootProject.file("CHANGELOG.md").text
    type = STABLE

    modrinth {
        displayName = releaseName
        projectId = project.modrinth_id
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        minecraftVersions.add("1.20.1")
        modLoaders.add("forge")
        optional("jei")
        optional("curios")
    }

    curseforge {
        displayName = releaseName
        projectId = "1596267"
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        minecraftVersions.add("1.20.1")
        modLoaders.add("forge")
        optional("jei")
        optional("curios")
        client = true
        server = true
    }
}

