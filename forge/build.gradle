plugins {
    id 'net.minecraftforge.gradle' version '6.0.+'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'me.modmuss50.mod-publish-plugin'
}

// The Minecraft version is part of the release name on purpose: CurseForge
// rejects a second file whose display name matches an existing one in the same
// project, and the same mod version is published for more than one Minecraft
// version.
def releaseName = "DayZ Inventory ${project.version} for ${project.minecraft_version}"

minecraft {
    mappings channel: 'official', version: project.minecraft_version
    
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            
            mods {
                dayz_inventory {
                    // Only this project's output is on the mod path. The common
                    // module's java and resources directories are compiled and
                    // processed into sourceSets.main above, so adding it again
                    // would put a second copy of the mixin configs and Loom's
                    // intermediary refmap on the classpath and break Mixin.
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                dayz_inventory {
                    // Only this project's output is on the mod path. The common
                    // module's java and resources directories are compiled and
                    // processed into sourceSets.main above, so adding it again
                    // would put a second copy of the mixin configs and Loom's
                    // intermediary refmap on the classpath and break Mixin.
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // NOTE: deliberately no `implementation project(':common')` here.
    // sourceSets.main below compiles the common module's sources directly, so a
    // project dependency would only put a second copy of those classes - and
    // Loom's intermediary refmap - on the classpath, which breaks Mixin.
}

sourceSets {
    main {
        java {
            srcDirs += project(':common').sourceSets.main.java.srcDirs
        }
        resources {
            srcDirs += project(':common').sourceSets.main.resources.srcDirs
        }
    }
}

mixin {
    add sourceSets.main, "dayz-inventory.refmap.json"
    config "dayz-inventory.mixins.json"
    config "dayz-inventory.client.mixins.json"
}

// The common module's classes and resources are compiled and processed into this
// project's own output via sourceSets.main above, so the jar needs no extra
// `from` for them. Anything pulled in from common's build directory would only
// add duplicate classes plus Loom's intermediary refmap, which Forge cannot use.
jar {
    // This is a DEVELOPMENT jar. ForgeGradle has not reobfuscated it yet, so it
    // still carries official (Mojang) member names, and Forge resolves members
    // against SRG at runtime - loading a class from it dies with
    // NoSuchFieldError: MENU. Keep it out of build/libs, which exists only to
    // hold the shippable artifact; see "Ship the REOBFUSCATED jar" below.
    destinationDirectory = layout.buildDirectory.dir('devlibs')

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes([
            'Specification-Title'     : 'dayz_inventory',
            'Specification-Vendor'    : 'suoim',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : 'suoim',
            'MixinConfigs'            : 'dayz-inventory.mixins.json,dayz-inventory.client.mixins.json'
        ])
    }
}

// MixinGradle writes the generated Searge refmap to build/tmp and only injects it
// into the packaged jar. Dev runs (`runClient` / `runServer`) load this mod from
// the compiled resources and classes directories instead, and the `common`
// project - which is built by Loom - contributes a refmap with the *same name*
// that targets intermediary. Forge cannot resolve intermediary targets, so Mixin
// would rewrite every target to class_XXXX names and fail with
// "specifies a target class which is not supported".
//
// Copy the Searge refmap into our own resources so this project's output, which
// Forge places first on the mod classpath, shadows the intermediary one during
// development exactly as it does in the packaged jar.
def forgeRefmap = layout.buildDirectory.file('tmp/compileJava/dayz-inventory.refmap.json')

tasks.named('processResources', ProcessResources) {
    dependsOn tasks.named('compileJava')

    // Bring in the Searge refmap so dev runs resolve it (see note below).
    from(forgeRefmap)

    // Keep the declared mod version in step with gradle.properties; it was
    // hardcoded and drifted (a 1.4.1 jar still reported 1.4.0).
    inputs.property "version", project.version
    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

base {
    archivesName = "dayz-inventory-forge-${project.minecraft_version}"
}

// --- Ship the REOBFUSCATED jar -------------------------------------------
// Forge resolves members against SRG at runtime, but the `jar` task packages
// against official (Mojang) names. The jar has to be reobfuscated before it can
// load at all - an unreobfuscated one dies the moment a mod class initialises,
// with NoSuchFieldError: MENU (Registries.MENU is f_256798_ on SRG).
//
// ForgeGradle replaces the `jar` task's output with the reobfuscated jar in
// place, and also writes a copy to build/reobfJar/output.jar. This copies that
// reobfuscated jar into build/libs under the release name. Reading ForgeGradle's
// own declared output, rather than the path the `jar` task happens to sit at,
// keeps the two concerns separate and makes this task the only writer of
// build/libs - `jar` writes to build/devlibs instead, so the two no longer
// contend for the same output file and Gradle's up-to-date checks stay coherent.
//
// The previous approach fixed up build/libs by overwriting the `jar` task's own
// output, which made `./gradlew build` produce a good jar but left publishing
// broken: `publishMods` read `jar.archiveFile`, which depends only on `jar`, and
// `:forge:publishMods` never runs `assemble` - so the fix-up never ran and the
// upload shipped the development jar. That is how the broken 1.4.2 reached
// Modrinth and CurseForge while the GitHub release, built by `./gradlew build`,
// was fine.
//
// Development runs never caught it either: `runClient` loads classes from the
// build output directories, which are on official names.
def releaseJarDir = layout.buildDirectory.dir('libs')
def releaseJarName = "${base.archivesName.get()}-${project.version}.jar"

def reobfuscatedJar = tasks.register('reobfuscatedJar', Copy) {
    // reobfJar is created lazily by ForgeGradle, so it can only be named from
    // inside a deferred block like this one.
    dependsOn tasks.named('reobfJar')

    from(layout.buildDirectory.file('reobfJar/output.jar'))
    into(releaseJarDir)
    rename { releaseJarName }
}

tasks.named('assemble') {
    dependsOn reobfuscatedJar
}

publishMods {
    // Must be the reobfuscated jar, and must be read off the task that writes it:
    // that is what makes publishMods depend on it. Resolving a plain path instead
    // would let `:forge:publishMods` upload a stale file - or, as with the broken
    // 1.4.2, the un-reobfuscated development jar.
    file = reobfuscatedJar.map { releaseJarDir.get().file(releaseJarName) }
    changelog = rootProject.file("CHANGELOG.md").text
    type = STABLE

    modrinth {
        displayName = releaseName
        projectId = project.modrinth_id
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        minecraftVersions.add("1.20.1")
        modLoaders.add("forge")
        optional("jei")
        optional("curios")
    }

    curseforge {
        displayName = releaseName
        projectId = "1596267"
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        minecraftVersions.add("1.20.1")
        modLoaders.add("forge")
        optional("jei")
        optional("curios")
        client = true
        server = true
    }
}
