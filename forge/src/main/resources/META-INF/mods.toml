modLoader="javafml"
loaderVersion="[52,)"
license="Apache-2.0"
issueTrackerURL="https://github.com/aacanadaa/DayZ-Inventory/issues"

[[mods]]
modId="dayz_inventory"
# Expanded from project.version by processResources. This was hardcoded once and
# drifted, so a 1.4.1 jar reported itself as 1.4.0 in crash reports.
version="${version}"
displayName="DayZ Inventory"
authors="suoim"
description="A complete overhaul of the Minecraft inventory UI, bringing the look, feel, and mechanics of the DayZ inventory system into Minecraft."
displayURL="https://modrinth.com/mod/dayz-inventory"
logoFile="assets/dayz_inventory/icon.png"

[[dependencies.dayz_inventory]]
modId="forge"
mandatory=true
versionRange="[52,)"
ordering="NONE"
side="BOTH"

[[dependencies.dayz_inventory]]
modId="minecraft"
mandatory=true
versionRange="[1.21.1,1.21.2)"
ordering="NONE"
side="BOTH"

[[dependencies.dayz_inventory]]
modId="jei"
mandatory=false
versionRange="*"
ordering="AFTER"
side="CLIENT"

[[dependencies.dayz_inventory]]
modId="curios"
mandatory=false
versionRange="*"
ordering="AFTER"
side="BOTH"

# Mixin configs are NOT declared here. Forge reads them from the MixinConfigs jar
# manifest attribute, set in build.gradle. [[mixins]] blocks are a
# NeoForge/Quilt extension that Forge's ModFileInfo does not parse.
