name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the built jars to Modrinth and CurseForge"
        type: boolean
        default: false
      platform:
        description: "Which platform to publish to"
        type: choice
        options: [all, modrinth, curseforge]
        default: all
      versions:
        description: "Comma-separated Minecraft versions to build (and publish), e.g. 1.21.1,1.21.5. Empty: all"
        type: string
        default: ""
      delete_modrinth_versions:
        description: "Comma-separated Modrinth version IDs to delete, then exit"
        type: string
        default: ""

# A newer push to the same branch or pull request supersedes the running build.
# Tag builds and manual runs can publish, so they always run to the end, and a
# manual run is in a group of its own so a push cannot cancel it.
concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

env:
  # Gradle's own daemon is pointless on a single-use runner.
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  # The Minecraft versions come from the `versions/` directory, the same place
  # settings.gradle.kts reads them from, so adding a version needs no CI edit.
  # A manual run can narrow them with the `versions` input, which is how the
  # upload of a few versions is finished without re-uploading the others.
  matrix:
    name: Version matrix
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.list.outputs.versions }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: List Minecraft versions
        id: list
        env:
          REQUESTED: ${{ inputs.versions }}
        run: |
          all=$(find versions -mindepth 2 -maxdepth 2 -name gradle.properties -printf '%h\n' \
            | xargs -n1 basename | sort -V)
          if [ -n "$REQUESTED" ]; then
            selected=""
            for v in $(echo "$REQUESTED" | tr ',' ' '); do
              if ! echo "$all" | grep -qxF "$v"; then
                echo "::error::Unknown Minecraft version '$v': there is no versions/$v directory"
                exit 1
              fi
              selected="$selected $v"
            done
            all=$(echo $selected | tr ' ' '\n' | sort -V -u)
          fi
          versions=$(echo "$all" | jq -R . | jq -cs .)
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          echo "Building: $versions"

  # Some runners are answered "not found" by the Gradle Plugin Portal for every
  # plugin, on every attempt. Most plugins are also on their own Maven
  # repository, but `kotlin-dsl` (build-logic), the foojay toolchain resolver and
  # the publish plugin only live on the portal. So one job resolves every
  # plugin the build uses - build-logic's, the settings plugins and the root
  # project's - and every other job restores them from the Actions cache. The
  # key follows every file that names a plugin or its version, so a hit is
  # always complete.
  gradle-plugins:
    name: Gradle plugins
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Cache Gradle plugins
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches/modules-2/files-2.1
            ~/.gradle/caches/modules-2/metadata-*
          key: gradle-plugins-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle.properties', 'settings.gradle.kts', 'stonecutter.gradle.kts', 'build-logic/build.gradle.kts', 'build-logic/settings.gradle.kts') }}

      # `-p build-logic jar` resolves and compiles build-logic on its own. `help`
      # on the root with configure-on-demand evaluates the settings and the root
      # project - every `plugins {}` block that names a version - without
      # configuring a single Minecraft node.
      - name: Download Gradle plugins
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2 3 4; do
            ./gradlew -p build-logic jar --stacktrace \
              && ./gradlew help --configure-on-demand --stacktrace \
              && exit 0
            echo "::warning::Download attempt $attempt failed; retrying"
            sleep $((attempt * 30))
          done
          exit 1

  # One job per Minecraft version. Configuring a node downloads and prepares
  # that Minecraft release, so building the whole matrix in one job ran the
  # runner out of disk; one version per job also builds them in parallel.
  build:
    name: Build ${{ matrix.minecraft }}
    needs: [matrix, gradle-plugins]
    # Runs even when the plugin download failed: the cache is then simply not
    # there, and the build asks the portal itself as before.
    if: >-
      !cancelled() && needs.matrix.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || inputs.delete_modrinth_versions == '')
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        minecraft: ${{ fromJson(needs.matrix.outputs.versions) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      # The Gradle launcher needs Java 25 (Loom and Minecraft 26.x require it).
      # The Java 17 and 21 toolchains the older nodes compile with are
      # downloaded on demand by the foojay resolver in settings.gradle.kts.
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"

      # setup-gradle's own cache stays off: two dozen jobs each holding a
      # prepared Minecraft install would evict one another from the repository's
      # cache budget, and a cold build of one version is quick. Only the small,
      # shared plugin cache below is restored.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      # Configuring a node downloads that Minecraft release, its mappings and
      # the loader toolchain. With every version building at once, one of those
      # downloads occasionally fails on a busy repository, so configuration is
      # done - and retried - on its own before anything is compiled.
      - name: Restore Gradle plugins
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/caches/modules-2/files-2.1
            ~/.gradle/caches/modules-2/metadata-*
          key: gradle-plugins-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle.properties', 'settings.gradle.kts', 'stonecutter.gradle.kts', 'build-logic/build.gradle.kts', 'build-logic/settings.gradle.kts') }}

      - name: Configure ${{ matrix.minecraft }}
        run: |
          # A network error is retried as is. Gradle remembers a "not found",
          # though, so the last two attempts ask every repository again - which
          # also re-checks the restored plugins, so they are not the first try.
          for attempt in 1 2 3 4; do
            refresh=""
            [ "$attempt" -gt 2 ] && refresh="--refresh-dependencies"
            ./gradlew help -Pdayz.versions=${{ matrix.minecraft }} $refresh --stacktrace && exit 0
            echo "::warning::Configuration attempt $attempt failed; retrying"
            sleep $((attempt * 30))
          done
          exit 1

      - name: Build ${{ matrix.minecraft }}
        run: ./gradlew buildMods -Pdayz.versions=${{ matrix.minecraft }} --continue --stacktrace

      - name: Upload mod jars
        uses: actions/upload-artifact@v7
        with:
          name: jars-${{ matrix.minecraft }}
          # Only the loader branches ship. The `common` branch is a compile-time
          # intermediate, and `-sources.jar` files are build output too.
          path: |
            fabric/versions/${{ matrix.minecraft }}/build/libs/*.jar
            neoforge/versions/${{ matrix.minecraft }}/build/libs/*.jar
            forge/versions/${{ matrix.minecraft }}/build/libs/*.jar
            !**/*-sources.jar
          if-no-files-found: error

  # A single, stable check name for branch protection: it passes only when
  # every version built.
  build-result:
    name: Build
    needs: build
    if: always() && (github.event_name != 'workflow_dispatch' || inputs.delete_modrinth_versions == '')
    runs-on: ubuntu-24.04
    steps:
      - name: Every version built
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::At least one Minecraft version failed to build (result: ${{ needs.build.result }})."
            exit 1
          fi

  # Maintenance hatch. A published Modrinth version cannot be replaced, so a bad
  # upload has to be deleted before the corrected one goes up. Version IDs come
  # from `GET https://api.modrinth.com/v2/project/<id>/version`.
  modrinth-delete:
    name: Delete Modrinth versions
    if: github.event_name == 'workflow_dispatch' && inputs.delete_modrinth_versions != ''
    runs-on: ubuntu-24.04
    steps:
      - name: Delete versions
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN || vars.MODRINTH_TOKEN }}
          VERSION_IDS: ${{ inputs.delete_modrinth_versions }}
        run: |
          if [ -z "$MODRINTH_TOKEN" ]; then
            echo "::error::No Modrinth token."
            exit 1
          fi
          for id in $(echo "$VERSION_IDS" | tr ',' ' '); do
            [ -z "$id" ] && continue
            echo -n "deleting $id -> "
            curl -sS -o /dev/null -w "%{http_code}\n" -X DELETE \
              -H "Authorization: $MODRINTH_TOKEN" \
              "https://api.modrinth.com/v2/version/$id"
          done

  release:
    name: Publish GitHub Release
    needs: build-result
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download mod jars
        uses: actions/download-artifact@v8
        with:
          pattern: jars-*
          path: dist
          merge-multiple: true

      # The release notes are this version's CHANGELOG.md section - the same
      # text the Modrinth and CurseForge version pages get.
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^# / { if (found) exit; if (index($0, v)) found = 1 }
            found && /^---[[:space:]]*$/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

      # Each artifact keeps the jars' paths inside the repository
      # (fabric/versions/<mc>/build/libs/...), so they are gathered into one
      # folder first. The v2.0.0 release went out with no files because the
      # release step only looked at the top of dist/.
      - name: Collect jars
        run: |
          mkdir -p release
          find dist -name '*.jar' -exec cp -t release {} +
          count=$(find release -name '*.jar' | wc -l)
          echo "$count jars"
          if [ "$count" -eq 0 ]; then
            echo "::error::No jars were downloaded"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: DayZ Inventory ${{ github.ref_name }}
          body_path: release-notes.md
          files: release/*.jar
          fail_on_unmatched_files: true

  publish:
    name: Publish ${{ matrix.minecraft }}
    needs: [matrix, build-result]
    # Tags publish; a manual run can too, which is how a partial upload gets
    # finished without re-uploading the platform that already succeeded.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # CurseForge answers a burst of uploads with rate-limit errors rather
      # than queueing them, so only a few versions upload at once.
      max-parallel: 3
      matrix:
        minecraft: ${{ fromJson(needs.matrix.outputs.versions) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      # Fails before Gradle starts, with a message that names the variable.
      # Without this the only symptom is an auth error from inside the publish
      # plugin that does not say what is missing.
      #
      # Every name is read from `secrets` first and then from `vars`. Secrets is
      # the right place for them: Variables are stored and shown in plain text.
      - name: Check publishing tokens
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN || vars.MODRINTH_TOKEN }}
          MODRINTH_PAT: ${{ secrets.MODRINTH_PAT || vars.MODRINTH_PAT }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY || vars.CURSEFORGE_API_KEY }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN || vars.CURSEFORGE_TOKEN }}
        run: |
          missing=0
          if [ -z "$MODRINTH_TOKEN" ] && [ -z "$MODRINTH_PAT" ]; then
            echo "::error::No Modrinth token. Add a repository SECRET named MODRINTH_TOKEN (Settings -> Secrets and variables -> Actions -> Secrets)."
            missing=1
          fi
          if [ -z "$CURSEFORGE_API_KEY" ] && [ -z "$CURSEFORGE_TOKEN" ]; then
            echo "::error::No CurseForge token. Add a repository SECRET named CURSEFORGE_API_KEY (Settings -> Secrets and variables -> Actions -> Secrets)."
            missing=1
          fi
          exit $missing

      - name: Restore Gradle plugins
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/caches/modules-2/files-2.1
            ~/.gradle/caches/modules-2/metadata-*
          key: gradle-plugins-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle.properties', 'settings.gradle.kts', 'stonecutter.gradle.kts', 'build-logic/build.gradle.kts', 'build-logic/settings.gradle.kts') }}

      - name: Configure ${{ matrix.minecraft }}
        run: |
          # A network error is retried as is. Gradle remembers a "not found",
          # though, so the last two attempts ask every repository again - which
          # also re-checks the restored plugins, so they are not the first try.
          for attempt in 1 2 3 4; do
            refresh=""
            [ "$attempt" -gt 2 ] && refresh="--refresh-dependencies"
            ./gradlew help -Pdayz.versions=${{ matrix.minecraft }} $refresh --stacktrace && exit 0
            echo "::warning::Configuration attempt $attempt failed; retrying"
            sleep $((attempt * 30))
          done
          exit 1

      - name: Publish ${{ matrix.minecraft }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN || vars.MODRINTH_TOKEN }}
          MODRINTH_PAT: ${{ secrets.MODRINTH_PAT || vars.MODRINTH_PAT }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY || vars.CURSEFORGE_API_KEY }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN || vars.CURSEFORGE_TOKEN }}
          PLATFORM: ${{ inputs.platform || 'all' }}
        run: |
          # `publishAll` uploads to both platforms, and Modrinth rejects a second
          # file whose name it already has, so a re-run after a one-platform
          # failure has to be able to target a single platform.
          case "$PLATFORM" in
            modrinth)   task=publishModrinthAll ;;
            curseforge) task=publishCurseforgeAll ;;
            *)          task=publishAll ;;
          esac
          echo "publishing ${{ matrix.minecraft }} via :$task"
          ./gradlew "$task" -Pdayz.versions=${{ matrix.minecraft }} -Ppublish.dry_run=false --stacktrace
