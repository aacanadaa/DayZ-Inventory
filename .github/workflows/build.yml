name: build

on:
  push:
    # `1.*` covers the pre-26 per-version branches (1.20.1, 1.21.1, 1.21.11, ...)
    # and `2*` the calendar-versioned ones (26.2, 26.3, ...). Plain `1.x` matches
    # only a branch literally named that, which nothing is.
    branches: [main, "1.*", "2*"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Deliberately version- and loader-agnostic. This string is a required
    # status check on main's branch protection, so renaming it per Minecraft
    # version (or per loader change) would silently block PRs - and merging a
    # branch that renamed it would break protection on the target.
    name: Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      # Minecraft 26.2 requires Java 25 (Mojang ship it as java-runtime-epsilon,
      # major version 25). The 1.20.1 branch uses 17 and the 1.21.x branches 21.
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build --stacktrace

      - name: Upload Fabric JAR
        uses: actions/upload-artifact@v7
        with:
          name: dayz-inventory-fabric
          path: fabric/build/libs/*.jar
          if-no-files-found: error

      - name: Upload NeoForge JAR
        uses: actions/upload-artifact@v7
        with:
          name: dayz-inventory-neoforge
          path: neoforge/build/libs/*.jar
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download Fabric JAR
        uses: actions/download-artifact@v6
        with:
          name: dayz-inventory-fabric
          path: dist/fabric

      - name: Download NeoForge JAR
        uses: actions/download-artifact@v6
        with:
          name: dayz-inventory-neoforge
          path: dist/neoforge

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/fabric/*.jar
            dist/neoforge/*.jar
          generate_release_notes: true
