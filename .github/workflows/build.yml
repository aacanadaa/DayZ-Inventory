name: build

on:
  push:
    # "1.*" not "1.x": GitHub Actions only globs "*", so the previous literal
    # "1.x" matched a branch that does not exist and version branches like
    # 1.21.1 never triggered a build at all.
    branches: [main, "1.*"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Deliberately version- and loader-agnostic. This string is a required
    # status check on main's branch protection, so renaming it per Minecraft
    # version (or per loader change) would silently block PRs - and merging a
    # branch that renamed it would break protection on the target.
    name: Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      # Minecraft 1.20.5+ requires Java 21. The 1.20.1 branch uses 17.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build --stacktrace

      - name: Upload Fabric JAR
        uses: actions/upload-artifact@v7
        with:
          name: dayz-inventory-fabric
          path: fabric/build/libs/*.jar
          if-no-files-found: error

      - name: Upload Forge JAR
        uses: actions/upload-artifact@v7
        with:
          name: dayz-inventory-forge
          path: forge/build/libs/*.jar
          if-no-files-found: error

      - name: Upload NeoForge JAR
        uses: actions/upload-artifact@v7
        with:
          name: dayz-inventory-neoforge
          path: neoforge/build/libs/*.jar
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download Fabric JAR
        uses: actions/download-artifact@v6
        with:
          name: dayz-inventory-fabric
          path: dist/fabric

      - name: Download Forge JAR
        uses: actions/download-artifact@v6
        with:
          name: dayz-inventory-forge
          path: dist/forge

      - name: Download NeoForge JAR
        uses: actions/download-artifact@v6
        with:
          name: dayz-inventory-neoforge
          path: dist/neoforge

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/fabric/*.jar
            dist/forge/*.jar
            dist/neoforge/*.jar
          generate_release_notes: true
