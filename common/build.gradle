plugins {
    id 'fabric-loom' version "${loom_version}"
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modCompileOnly "net.fabricmc:fabric-loader:${project.loader_version}"
    modCompileOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

loom {
    mixin {
        // The mixin configs in common/src/main/resources declare
        // "refmap": "dayz-inventory.refmap.json". Loom defaults to naming the
        // generated refmap after the project directory ("common-refmap.json"),
        // which does not match, so the Fabric mixins would fail to remap at
        // runtime. Forcing the name here keeps Fabric in sync with the declared
        // refmap (Forge's MixinGradle emits the same name via forge/build.gradle).
        defaultRefmapName = "dayz-inventory.refmap.json"
    }
}

configurations {
    runtimeClasspath {
        exclude group: 'net.fabricmc', module: 'sponge-mixin'
    }
    runtimeElements {
        exclude group: 'net.fabricmc', module: 'sponge-mixin'
    }
}
