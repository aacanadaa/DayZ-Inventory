plugins {
    // 26.2 moved the plugin id under the net.fabricmc namespace.
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // No `mappings` line: Minecraft 26.x ships unobfuscated, so there is nothing
    // to map and nothing to remap. Asking for `loom.officialMojangMappings()`
    // fails the build with "Failed to find official mojang mappings for 26.2",
    // because the version manifest no longer publishes a client_mappings entry.
    compileOnly "net.fabricmc:fabric-loader:${project.loader_version}"
    compileOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// No loom.mixin block: with no mappings there is no refmap to name, and Loom
// no longer enables the mixin annotation processor by default.

configurations {
    runtimeClasspath {
        exclude group: 'net.fabricmc', module: 'sponge-mixin'
    }
    runtimeElements {
        exclude group: 'net.fabricmc', module: 'sponge-mixin'
    }
}
