# Minecraft 1.20.2
#
# Obfuscated (official mappings + intermediary), Java 17. Still on the pre-1.20.5
# networking path: `CustomPacketPayload` exists here but has no `Type` and no
# `StreamCodec`, so the channel is the bare ResourceLocation + FriendlyByteBuf
# one used by 1.20.1. NeoForge is absent - its 1.20.2 release still uses the
# SimpleChannel stack, which this tree does not carry.
deps.minecraft=1.20.2
deps.java=17
deps.mixin-compat=JAVA_17
deps.pack-format=18

# Fabric
deps.fabric-loader=0.16.14
deps.fabric-api=0.91.6+1.20.2

# Publishing metadata
meta.minecraft-range=[1.20.2,1.20.3)
