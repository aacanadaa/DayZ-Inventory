# Minecraft 1.21.1 - the first line with a NeoForge branch.
#
# Still obfuscated, still Java 21, still Yarn-era Fabric API packages, but the
# custom-payload networking rewrite landed here, so `DayZInventoryPayload` and
# `DayZInventoryOpenData` only exist from this version onwards.
deps.minecraft=1.21.1
deps.java=21
# Mixin's language level for this game version.
deps.mixin-compat=JAVA_21

# Fabric
deps.fabric-loader=0.16.14
deps.fabric-api=0.116.17+1.21.1

# Forge
deps.forge=52.1.12

# NeoForge
deps.neoforge=21.1.250

# Publishing metadata
meta.minecraft-range=[1.21,1.21.2)
# Resource pack format for this release (pack.mcmeta).
deps.pack-format=34
