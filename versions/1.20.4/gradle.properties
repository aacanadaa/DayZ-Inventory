# Minecraft 1.20.4
#
# Obfuscated (official mappings + intermediary), Java 17. Same pre-1.20.5
# networking path as 1.20.2 and 1.20.3. NeoForge 20.4.x switched to the
# registrar API (`RegisterPayloadHandlerEvent` -> `IPayloadRegistrar`) while
# vanilla still had no `StreamCodec`, so a NeoForge build here would need a
# payload type of its own - see docs/BUILDING.md section 7.
deps.minecraft=1.20.4
deps.java=17
deps.mixin-compat=JAVA_17
deps.pack-format=22

# Fabric
deps.fabric-loader=0.16.14
deps.fabric-api=0.97.3+1.20.4

# Publishing metadata
meta.minecraft-range=[1.20.4,1.20.5)
