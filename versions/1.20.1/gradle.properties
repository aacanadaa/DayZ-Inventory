# Minecraft 1.20.1 - the legacy line.
#
# Obfuscated release: Mojang mappings + Fabric intermediary, so Fabric jars are
# remapped and the Forge jar is reobfuscated. See docs/BUILDING.md.
deps.minecraft=1.20.1
deps.java=17
# Mixin's language level for this game version.
deps.mixin-compat=JAVA_17

# Fabric
deps.fabric-loader=0.16.14
deps.fabric-api=0.92.9+1.20.1

# Forge (LexForge - NeoForge does not exist for 1.20.1)
deps.forge=47.2.0

# Publishing metadata
meta.minecraft-range=[1.20.1,1.20.2)
# Resource pack format for this release (pack.mcmeta).
deps.pack-format=15
