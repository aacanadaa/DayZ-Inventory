# Minecraft 1.20.1 - the oldest supported line, and the most played Forge one.
#
# Obfuscated, Java 17, and older than the 1.20.5 networking rewrite: there are no
# custom payload records, so the channel is a bare ResourceLocation carrying a
# FriendlyByteBuf and the send/receive code lives behind `//? if <1.20.5`.
#
# Forge 1.20.1 still runs on SRG names. It is built with ModDevGradle's
# `legacyforge` plugin, which reobfuscates the jar and generates the Searge
# mixin refmap (forge/build.gradle.kts).
loaders=fabric,forge
deps.minecraft=1.20.1
deps.java=17
deps.mixin-compat=JAVA_17
deps.pack-format=15

# Fabric
deps.fabric-loader=0.20.1
deps.fabric-api=0.92.12+1.20.1

# Forge (NeoForge does not exist for 1.20.1)
deps.forge=47.4.28

# Publishing metadata
meta.minecraft-range=[1.20.1,1.20.2)
# Modpacks pin many different 47.x builds, and everything this mod uses has
# existed since 47.0, so any 47.x is accepted.
meta.forge-range=[47,)
