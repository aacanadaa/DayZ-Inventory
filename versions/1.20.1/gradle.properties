# Minecraft 1.20.1 - the last line before the 1.20.5 networking rewrite.
#
# Obfuscated (official mappings + Fabric intermediary), Java 17. This is the one
# version with no custom payload records: the channel is a bare ResourceLocation
# carrying a FriendlyByteBuf, ExtendedScreenHandlerType takes no opening-data
# codec, and the send/receive code all lives behind `//? if <1.20.5`.
deps.minecraft=1.20.1
deps.java=17
deps.mixin-compat=JAVA_17
deps.pack-format=15

# Fabric
deps.fabric-loader=0.16.14
deps.fabric-api=0.92.12+1.20.1

# Forge (LexForge - NeoForge does not exist for 1.20.1)
deps.forge=47.4.23

# Publishing metadata
meta.minecraft-range=[1.20.1,1.20.2)
