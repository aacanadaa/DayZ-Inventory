# Minecraft 26.2 - the current unobfuscated line.
#
# From 26.1 onward Minecraft ships without obfuscation: there are no mappings,
# no refmaps and no remap step at all. The GUI is a render-state pipeline
# (`GuiGraphicsExtractor`, every `render*` is now `extract*`) and Java 25 is
# required (Mojang ship it as `java-runtime-epsilon`).
deps.minecraft=26.2
deps.java=25
# Mixin's language level for this game version.
deps.mixin-compat=JAVA_25

# Fabric
deps.fabric-loader=0.19.5
deps.fabric-api=0.160.0+26.2

# NeoForge
deps.neoforge=26.2.0.88

# Publishing metadata
meta.minecraft-range=[26.2,26.3)
# Resource pack format for this release (pack.mcmeta).
deps.pack-format=64
