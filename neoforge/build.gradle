plugins {
    id 'net.neoforged.moddev' version '2.0.147'
    id 'me.modmuss50.mod-publish-plugin'
}

// The Minecraft version is part of the release name on purpose: CurseForge
// rejects a second file whose display name matches an existing one in the same
// project, and the same mod version is published for more than one Minecraft
// version.
def releaseName = "DayZ Inventory ${project.version} for ${project.minecraft_version}"

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
            gameDirectory = project.file('run')
        }
        server {
            server()
            gameDirectory = project.file('run')
        }
    }

    mods {
        dayz_inventory {
            sourceSet sourceSets.main
        }
    }
}

// The common module is compiled into this project rather than consumed as a jar,
// the same way forge/ does on 1.20.1. That keeps a single copy of every class on
// the mod classpath and lets the shared mixin classes be picked up directly.
//
// No refmap handling is needed here: NeoForge has used official Mojang names at
// runtime since 1.20.2, so mixin selectors written in official names resolve as
// written. (On 1.20.1/Forge this needed a Searge refmap; that problem does not
// exist on NeoForge.)
sourceSets {
    main {
        java {
            srcDirs += project(':common').sourceSets.main.java.srcDirs
        }
        resources {
            srcDirs += project(':common').sourceSets.main.resources.srcDirs
        }
    }
}

dependencies {
    // NeoForge itself comes from the moddev plugin - no coordinate needed.
}

base {
    archivesName = "dayz-inventory-neoforge-${project.minecraft_version}"
}

// neoforge.mods.toml carries an expanded "${version}". Without this the file
// ships the literal placeholder and the jar cannot load, and a hardcoded value
// drifts silently - a 1.4.1 jar once reported itself as 1.4.0 in crash reports.
tasks.named('processResources', ProcessResources) {
    inputs.property "version", project.version
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}

publishMods {
    file = jar.archiveFile
    changelog = rootProject.file("CHANGELOG.md").text
    type = STABLE

    modrinth {
        displayName = releaseName
        projectId = project.modrinth_id
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        minecraftVersions.add(project.minecraft_version)
        modLoaders.add("neoforge")
        optional("jei")
        optional("curios")
    }

    curseforge {
        displayName = releaseName
        projectId = "1596267"
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        minecraftVersions.add(project.minecraft_version)
        modLoaders.add("neoforge")
        optional("jei")
        optional("curios")
        client = true
        server = true
    }
}

