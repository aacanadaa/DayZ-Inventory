modLoader="javafml"
loaderVersion="[4,)"
license="${mod_license}"
issueTrackerURL="${mod_issues}"

[[mods]]
modId="${mod_id}"
# Expanded from gradle.properties by processResources. Keep it a placeholder:
# a hardcoded value here drifted once and shipped a 1.4.1 jar that reported
# itself as 1.4.0 in crash reports.
version="${version}"
displayName="${mod_name}"
authors="${mod_author}"
description="${mod_description}"
displayURL="https://modrinth.com/mod/dayz-inventory"
logoFile="assets/dayz_inventory/icon.png"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neoforge_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="jei"
type="optional"
versionRange="*"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="curios"
type="optional"
versionRange="*"
ordering="AFTER"
side="BOTH"

# NeoForge has no MixinGradle step and no refmap: it has run on official Mojang
# names since 1.20.2, so the selectors in the shared configs resolve as written.
[[mixins]]
config="dayz-inventory.mixins.json"

[[mixins]]
config="dayz-inventory.client.mixins.json"
