pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'Sponge'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
    }
}

rootProject.name = 'dayz-inventory'

include 'common'
include 'fabric'

// Forge does not carry forward to 1.21.x - the ecosystem moved to NeoForge.
// The NeoForge port is a separate piece of work; until then this branch builds
// Fabric only. The 1.20.1 branch still ships both loaders.
// include 'forge'
