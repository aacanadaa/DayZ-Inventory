pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'Sponge'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
    }
}

rootProject.name = 'dayz-inventory'

include 'common'
include 'fabric'

// Forge 1.21.1 ships alongside NeoForge. The two are separate modules rather
// than one shared one because the plugin, the package names, the networking
// stack and the runtime mapping situation all differ between them.
//
// (An earlier note here claimed "Forge does not carry forward to 1.21.x". That
// was wrong: Forge 52.x for 1.21.1 exists and is maintained. What was true is
// that the old `forge/` directory held 1.20.1-era code, which is why the module
// was rebuilt for 1.21.1 rather than re-enabled as-is.)
include 'forge'
include 'neoforge'
