pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'Sponge'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
    }
}

rootProject.name = 'dayz-inventory'

include 'common'
include 'fabric'

// Forge does not carry forward to 1.21.x - the ecosystem moved to NeoForge.
// `forge/` is left in place but unbuilt on this branch; the 1.20.1 line still
// ships it. NeoForge is a separate module rather than a port of forge/ because
// the plugin, the package names and the networking stack all differ.
// include 'forge'
// include 'neoforge'  // parked while Fabric is ported first
