# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Version properties
minecraft_version=1.21.1
loader_version=0.19.3
loom_version=1.8.13
# Forge 1.21.1. 52.1.12 is deliberately pinned: ForgeGradle switched from 6.x to
# 7.x (and Gradle 8 to 9) at Forge 52.1.14, and this build is on Gradle 8.10.2
# for Loom's sake. 52.1.12 is the last 52.x release still on ForgeGradle 6.
forge_version=52.1.12
neoforge_version=21.1.250

# Mod Properties
mod_version=1.4.2
maven_group=com.suoim.dayzinventory
mod_license=Apache-2.0
mod_authors=suoim
mod_description=A complete overhaul of the Minecraft inventory UI, bringing the look, feel, and mechanics of the DayZ inventory system into Minecraft.

# Repository links
github_repo=https://github.com/aacanadaa/DayZ-Inventory
modrinth_project=dayz-inventory
modrinth_id=8asZxzdc

# Dependencies
fabric_api_version=0.116.17+1.21.1

# Java toolchain: this project targets Java 17 (Minecraft 1.20.1).
# Do NOT hardcode org.gradle.java.home here - it is machine-specific and breaks
# CI and other developers' builds. Set JAVA_HOME to a JDK 17+ instead.
# Gradle 8.8 supports JDK 17 through 22.
