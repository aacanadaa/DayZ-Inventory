# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Version properties
minecraft_version=26.2
loader_version=0.19.5
loom_version=1.17.20
forge_version=26.2-65.1.3
neoforge_version=26.2.0.88

# Mod Properties
mod_version=1.5.0
maven_group=com.suoim.dayzinventory
mod_license=Apache-2.0
mod_authors=suoim
mod_description=A complete overhaul of the Minecraft inventory UI, bringing the look, feel, and mechanics of the DayZ inventory system into Minecraft.

# Repository links
github_repo=https://github.com/aacanadaa/DayZ-Inventory
modrinth_project=dayz-inventory
modrinth_id=8asZxzdc

# Dependencies
fabric_api_version=0.160.0+26.2

# Java toolchain: Minecraft 26.2 requires Java 25 (Mojang ship it as
# java-runtime-epsilon, major version 25).
# Do NOT hardcode org.gradle.java.home here - it is machine-specific and breaks
# CI and other developers' builds. Set JAVA_HOME to a JDK 25 instead.
# Gradle 9.5.1 supports JDK 25.
