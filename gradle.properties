# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true
# IntelliJ IDEA is not yet fully compatible with configuration cache, see:
# https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# ---------------------------------------------------------------------------
# Mod metadata - the single source of truth for every generated manifest
# ---------------------------------------------------------------------------
mod.id=dayz_inventory
mod.name=DayZ Inventory
mod.version=1.8.2
mod.group=com.suoim.dayzinventory
mod.author=suoim
mod.license=Apache-2.0
mod.description=A complete overhaul of the Minecraft inventory UI, bringing the look, feel, and mechanics of the DayZ inventory system into Minecraft.
mod.github=https://github.com/aacanadaa/DayZ-Inventory
mod.sources=https://github.com/aacanadaa/DayZ-Inventory
mod.issues=https://github.com/aacanadaa/DayZ-Inventory/issues
mod.channel_tag=release

# ---------------------------------------------------------------------------
# Publishing targets
# ---------------------------------------------------------------------------
modrinth.id=8asZxzdc
modrinth.slug=dayz-inventory
curseforge.id=1596267
curseforge.slug=dayz-inventory

# ---------------------------------------------------------------------------
# Toolchain
# ---------------------------------------------------------------------------
# Fabric Loom version used by the `common` and `fabric` branches. The
# `loom-back-compat` plugin picks the right *flavour* of Loom automatically
# (`fabric-loom-remap` for obfuscated Minecraft < 26.1, `fabric-loom` for the
# unobfuscated 26.1+ releases) while this single version stays constant.
loomx.loom_version=1.18.1

# NeoForge ModDevGradle version, used by both the `neoforge` and `forge` branches.
moddev.version=2.0.147

# Publishing is a no-op unless `publish.dry_run=false` is set explicitly.
publish.dry_run=true

# Do NOT hardcode org.gradle.java.home here - it is machine-specific and breaks
# CI and other developers' builds. The Java toolchain is resolved per Minecraft
# version from versions/<mc>/gradle.properties and downloaded by the foojay
# resolver when missing.
